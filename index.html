<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Study Check</title><style>body{margin:0;background:#f3f6fc;color:#122544;font:17px Arial,sans-serif}main{max-width:850px;margin:35px auto;padding:0 18px}h1{font-size:36px;margin-bottom:8px}p{line-height:1.55}.sub{color:#526783}.card{background:white;border:1px solid #d9e2f0;border-radius:17px;padding:30px;margin-top:25px;box-shadow:0 6px 22px #172c4a0a}h2{font-size:25px}h3{font-size:19px}.eyebrow{font-size:13px;font-weight:bold;letter-spacing:1px;color:#3e5d86}button{padding:14px 18px;border-radius:9px;border:1px solid #9baecc;background:white;color:#142b50;font-size:15px;font-weight:bold;cursor:pointer;margin:6px 8px 6px 0}button.primary{background:#2751bd;color:white;border-color:#2751bd}button:hover{filter:brightness(.95)}.advice{background:#fff4e3;border-left:4px solid #dd8c1f;padding:16px;margin:20px 0}.info{background:#eef2ff;border-left:4px solid #3157c6;padding:16px;margin:20px 0}.progress{display:flex;gap:8px;margin:20px 0}.progress span{height:9px;border-radius:9px;background:#dce4f0;flex:1}.progress span.on{background:#2751bd}.question{font-weight:bold;font-size:20px}.answer{display:block;text-align:left;width:100%;margin:9px 0}.selected{border:2px solid #2751bd;background:#edf2ff}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #d6dfed;padding:12px;text-align:left}th{background:#eef2fa}.muted{color:#5a6b82;font-size:14px}@media(max-width:600px){h1{font-size:28px}.card{padding:18px}table{font-size:12px}th,td{padding:6px}}</style></head><body><main><h1>AI Study Check</h1><p class="sub">Explore how AI answers influence exam revision decisions.</p><div class="progress" id="progress"></div><section class="card" id="app"></section></main><script>
const cases=[{topic:'Machine Learning',question:'A clustering algorithm gives a silhouette score of −0.25 for a data point. What does this suggest?',options:['The point is likely closer to another cluster than its own','The point is perfectly matched to its own cluster'],correct:0,ai:1,explain:'A negative silhouette score indicates the point is, on average, closer to a neighbouring cluster than to its assigned cluster.'},{topic:'Neural Networks',question:'A model has very low training loss but much higher validation loss. What is the most likely explanation?',options:['The model is overfitting the training data','The model is guaranteed to generalise well'],correct:0,ai:0,explain:'A large training–validation performance gap is a common sign of overfitting.'},{topic:'Model Evaluation',question:'A binary classifier predicts every example as negative in a dataset containing 95% negative examples. Which statement is correct?',options:['Its accuracy is 95%, but it fails to detect positive examples','Its accuracy is 5%, because it never predicts positive'],correct:0,ai:1,explain:'It correctly predicts the 95% negative examples, so accuracy is 95%, but recall for the positive class is zero.'}];
let mode='delayed',i=0,step='setup',initial=null,final=null,records=[],choice=null;
const app=document.getElementById('app'),prog=document.getElementById('progress');
const label=n=>cases[i].options[n];
function button(text,fn,primary=false){const b=document.createElement('button');b.textContent=text;b.className=primary?'primary':'';b.onclick=fn;return b}
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function add(tag,text,cls){const e=node(tag,text,cls);app.append(e);return e}
function render(){app.replaceChildren();prog.replaceChildren();let count=step==='setup'?0:step==='question'?1:step==='advice'?2:step==='final'?3:4;for(let k=0;k<4;k++){let s=document.createElement('span');if(k<count)s.className='on';prog.append(s)}
if(step==='setup'){add('p','STUDY SETUP','eyebrow');add('h2','Compare two ways of showing AI answers');add('p','Review three exam-revision questions. In one version, answer independently before seeing AI advice. In the other, AI advice appears immediately.');for(const [val,txt] of [['delayed','Answer first, then see AI advice'],['immediate','See AI advice immediately']]){let l=document.createElement('label');l.style.display='block';l.style.margin='15px 0';let r=document.createElement('input');r.type='radio';r.name='mode';r.checked=mode===val;r.onchange=()=>mode=val;l.append(r,' '+txt);app.append(l)}app.append(button('Start demonstration',()=>{i=0;records=[];step='question';render()},true));return}
if(step==='summary'){add('p','DEMONSTRATION SUMMARY','eyebrow');add('h2','Your decisions');add('p','Interaction version: '+(mode==='delayed'?'Answer before AI':'AI shown immediately'));const t=document.createElement('table');t.innerHTML='<thead><tr><th>Case</th><th>Initial answer</th><th>AI answer</th><th>Final answer</th><th>Correct?</th></tr></thead>';const tb=document.createElement('tbody');records.forEach((r,j)=>{let tr=document.createElement('tr');[j+1,r.initial===null?'Not collected':r.initial===0?'Option A':'Option B',r.ai===0?'Option A':'Option B',r.final===0?'Option A':'Option B',r.final===r.correct?'Yes':'No'].forEach(v=>tr.append(node('td',String(v))));tb.append(tr)});t.append(tb);app.append(t);add('p','Correct final answers: '+records.filter(r=>r.final===r.correct).length+'/3. '+(mode==='delayed'?'Decisions changed: '+records.filter(r=>r.initial!==r.final).length+'/3.':'No independent initial answers collected in this version.'));app.append(button('Restart / choose other version',()=>{step='setup';render()},true),button('Download session JSON',()=>{const blob=new Blob([JSON.stringify({version:mode,records},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-study-check-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}));return}
const c=cases[i];add('p',step==='question'?(mode==='delayed'?'STEP 1 · INDEPENDENT ANSWER':'STEP 1 · AI SHOWN IMMEDIATELY'):step==='advice'?'STEP 2 · AI ANSWER':step==='final'?'FINAL ANSWER':'QUESTION FEEDBACK','eyebrow');add('h2','Question '+(i+1)+' of 3: '+c.topic);add('p',c.question,'question');
if((mode==='immediate'&&step==='question')||step==='advice'||step==='final'||step==='feedback'){let box=add('div','AI suggestion: '+label(c.ai),'advice');box.setAttribute('role','note')}
if(step==='question'){add('p',mode==='delayed'?'Choose your answer before seeing the AI suggestion.':'Choose your answer after seeing the AI suggestion.');c.options.forEach((o,n)=>app.append(button(String.fromCharCode(65+n)+'. '+o,()=>{if(mode==='delayed'){initial=n;step='advice'}else{initial=null;final=n;step='feedback'}render()},false)));return}
if(step==='advice'){add('p','Your independent answer: '+label(initial));app.append(button('Continue to final answer',()=>{step='final';render()},true));return}
if(step==='final'){add('p','Your first answer: '+label(initial));add('p','After seeing the AI suggestion, choose your final answer.');c.options.forEach((o,n)=>app.append(button(String.fromCharCode(65+n)+'. '+o,()=>{final=n;step='feedback';render()},false)));return}
if(step==='feedback'){add('h3','Review your answer');add('p','AI suggestion: '+label(c.ai));if(mode==='delayed')add('p','Initial answer: '+label(initial));add('p','Final answer: '+label(final));add('p','Correct answer: '+label(c.correct));add('div',c.explain,'info');add('p',final===c.correct?'Your final answer was correct.':'Your final answer was incorrect.');app.append(button(i===2?'View summary':'Next question',()=>{records.push({topic:c.topic,initial,ai:c.ai,final,correct:c.correct});if(i===2)step='summary';else{i++;initial=null;final=null;step='question'}render()},true));return}}
render();
</script></body></html>
